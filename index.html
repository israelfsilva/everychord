<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenChords: Utilitário desktop-first com motor combinatório puro de acordes, heurística biomecânica de digitação e síntese de áudio Tone.js." />
    <title>OpenChords • Motor Combinatório de Voicings</title>
    <script>
      // Apply saved/system theme before first paint (see src/lib/theme.ts)
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('openchords-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
