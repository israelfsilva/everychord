<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Todas as formas de tocar um acorde no violão, guitarra ou baixo, em qualquer afinação. Veja os diagramas, ouça cada posição e escolha a mais confortável." />
    <title>OpenChords • Acordes para violão, guitarra e baixo</title>
    <script>
      // Apply saved/system theme before first paint (see src/lib/theme.ts)
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('openchords-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
