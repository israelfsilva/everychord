<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenChords • Guitar and bass chords in any tuning</title>
    <meta name="description" content="Every way to play a chord on guitar or bass, in any tuning. See the diagrams, hear each voicing, and pick the one that fits your hand best." />
    <meta name="theme-color" content="#141413" />
    <link rel="canonical" href="https://israelfsilva.github.io/openchords/" />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp, Slack…): URLs must be absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenChords" />
    <meta property="og:url" content="https://israelfsilva.github.io/openchords/" />
    <meta property="og:title" content="OpenChords • Guitar and bass chords in any tuning" />
    <meta property="og:description" content="Every way to play a chord on guitar or bass, in any tuning. See the diagrams, hear each voicing, and pick the one that fits your hand best." />
    <meta property="og:image" content="https://israelfsilva.github.io/openchords/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenChords: chord diagrams for every voicing of a C major chord, with a fretboard view" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenChords • Guitar and bass chords in any tuning" />
    <meta name="twitter:description" content="Every way to play a chord on guitar or bass, in any tuning. See the diagrams, hear each voicing, and pick the one that fits your hand best." />
    <meta name="twitter:image" content="https://israelfsilva.github.io/openchords/og-image.png" />
    <meta name="twitter:image:alt" content="OpenChords: chord diagrams for every voicing of a C major chord, with a fretboard view" />
    <script>
      // Apply saved/system theme before first paint (see src/lib/theme.ts)
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('openchords-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
